name: Update Counter

on:
  workflow_dispatch:
  repository_dispatch:
    types: [update_counter]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.COUNTER_TOKEN }}

      - name: Update counter
        run: |
          echo "Updating counter..."
          # Hier kommt später dein echter Code hin

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/sitemap.xml || true
          git commit -m "Update counter" || true
          git push origin HEAD:main
