name: Update Counter

on:
  workflow_dispatch:
  repository_dispatch:
    types: [update_counter]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update counter
        run: |
          echo "Updating counter..."
          # Hier kommt später dein echter Code hin

      - name: Commit and push changes
        env:
          TOKEN: ${{ secrets.COUNTER_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/counter.svg || true
          git commit -m "Update counter" || true
          git push https://x-access-token:${TOKEN}@github.com/weltall-verlag/i-ching.git HEAD:main
