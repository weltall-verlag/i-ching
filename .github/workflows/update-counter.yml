name: Update Counter

on:
  workflow_dispatch:
  repository_dispatch:
    types: [update_counter]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update counter
        run: |
          echo "Updating counter..."
          # Hier steht dein eigentlicher Update-Code
          # Beispiel: python scripts/update_counter.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/counter.svg || true
          git commit -m "Update counter" || true
          git push https://x-access-token:${{ secrets.COUNTER_TOKEN }}@github.com/weltall-verlag/i-ching.git HEAD:main

        env:
          GITHUB_TOKEN: ${{ secrets.COUNTER_TOKEN }}
