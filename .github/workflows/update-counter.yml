name: Update Counter

on:
  workflow_dispatch:
  repository_dispatch:
    types: [update_counter]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update counter
        run: |
          echo "Updating counter..."
          # Hier steht dein eigentlicher Update-Code

      - name: Commit and push changes
        env:
          COUNTER_TOKEN: ${{ secrets.COUNTER_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Prüfen ob sich etwas geändert hat
          if ! git diff --quiet docs/counter.svg; then
            git add docs/counter.svg
            git commit -m "Update counter"
            
            # Remote auf den Token umstellen
            git remote set-url origin https://x-access-token:${COUNTER_TOKEN}@github.com/weltall-verlag/i-ching.git
            
            # Falls Remote weiter ist, rebasen
            git pull --rebase origin main || echo "Rebase übersprungen"
            
            # Pushen
            git push origin HEAD:main
          else
            echo "Keine Änderungen, überspringe."
          fi
